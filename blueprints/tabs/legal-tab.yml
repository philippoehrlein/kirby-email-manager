label: philippoehrlein.kirby-email-manager.panel.legal.headline
icon: document

fields:

  kem_email_legal_form:
    type: toggle
    label: philippoehrlein.kirby-email-manager.panel.legal.use_form_label
    text:
      - philippoehrlein.kirby-email-manager.panel.legal.use_form_no
      - philippoehrlein.kirby-email-manager.panel.legal.use_form_yes
    default: false
    help: philippoehrlein.kirby-email-manager.panel.legal.use_form_help

  legal_fields:
    extends: email-manager/legal-fields
    when:
      kem_email_legal_form: true
